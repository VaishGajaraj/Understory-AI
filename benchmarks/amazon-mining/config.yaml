# Amazon mining benchmark — same pipeline as amazon-para; class focus is mining.
# Labels empty until external records are transcribed. Do not treat an empty
# run as a published result.
name: amazon-mining
aoi: aoi.yaml
start: "2026-01-01"
end: "2026-12-31"
detector: v0-filters
detector_config:
  baseline:
    window_pairs: 8
    min_history_pairs: 4
    anomaly_sigma: 3.0
  filters:
    min_persistence_pairs: 2
    min_cluster_pixels: 12
    min_linearity: 0.0
labels: ../../packages/understory-labels/data/events/amazon-mining.geojson
stack_store: ../../data/scratch/amazon-mining.zarr
report_out: reports/amazon-mining.json
